# CubeSat C2 — single-host environment
# Usage: docker compose up
#
# Security posture:
# - No default passwords. The `secrets` service generates random
#   credentials into the `cubesat-secrets` volume on first start and every
#   service reads them from there (deployment/bootstrap/init-secrets.sh).
#   Pin a value by setting it in .env, e.g. POSTGRES_PASSWORD=...
# - Only the web UI (3000) and Grafana (3001) listen on the network.
#   TimescaleDB, Redis, NATS, Prometheus, Loki and the raw API bind to
#   127.0.0.1: reachable from this machine for development, not from the LAN.
# - NATS requires authentication with per-service permissions
#   (deployment/nats/nats-server.conf).

x-secrets-volume: &secrets-ro cubesat-secrets:/run/secrets/cubesat:ro

services:
  # === One-shot credential generator ===
  secrets:
    image: alpine:3.20
    container_name: cubesat-secrets
    # entrypoint (not command) so `docker compose run --rm secrets show`
    # passes "show" to the script.
    entrypoint: ["/bin/sh", "/init-secrets.sh"]
    environment:
      # Optional overrides from .env; empty = keep/generate the stored value.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - NATS_PASSWORD=${NATS_PASSWORD:-}
      - NATS_GROUNDSTATION_PASSWORD=${NATS_GROUNDSTATION_PASSWORD:-}
      - GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
    volumes:
      - cubesat-secrets:/run/secrets/cubesat
      - ./deployment/bootstrap/init-secrets.sh:/init-secrets.sh:ro
    restart: "no"

  # === TimescaleDB (PostgreSQL + time-series extension) ===
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: cubesat-timescaledb
    depends_on:
      secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cubesat}
      POSTGRES_PASSWORD_FILE: /run/secrets/cubesat/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-cubesat_c2}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - *secrets-ro
    restart: unless-stopped
    healthcheck:
      # Over TCP: on first start the image runs a temporary, socket-only
      # server for its init scripts, which a plain pg_isready reports as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-cubesat} -d ${POSTGRES_DB:-cubesat_c2}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Redis (cache) ===
  redis:
    image: redis:7-alpine
    container_name: cubesat-redis
    depends_on:
      secrets:
        condition: service_completed_successfully
    command: ["sh", "-c", "exec redis-server --requirepass \"$$(cat /run/secrets/cubesat/redis_password)\""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
      - *secrets-ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/cubesat/redis_password)\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === NATS JetStream (message bus) ===
  nats:
    image: nats:alpine
    container_name: cubesat-nats
    depends_on:
      secrets:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - |
        export NATS_BACKEND_PASSWORD="$$(cat /run/secrets/cubesat/nats_password)"
        export NATS_GROUNDSTATION_PASSWORD="$$(cat /run/secrets/cubesat/nats_groundstation_password)"
        exec nats-server -c /etc/nats/nats-server.conf
    ports:
      - "127.0.0.1:4222:4222"   # Client connections
      - "127.0.0.1:8222:8222"   # HTTP monitoring
    volumes:
      - nats-data:/data
      - ./deployment/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - *secrets-ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Backend API (FastAPI) ===
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cubesat-backend
    ports:
      - "127.0.0.1:8000:8000"   # direct API access for development; the UI goes through nginx
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=timescaledb
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-cubesat}
      - POSTGRES_DB=${POSTGRES_DB:-cubesat_c2}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NATS_URL=nats://nats:4222
      - NATS_USER=backend
      # Passwords and the JWT key come from the generated secret files.
      - CUBESAT_SECRETS_DIR=/run/secrets/cubesat
      # nginx in the frontend container is the only proxy allowed to set
      # X-Forwarded-For (login rate limiting keys on the client IP).
      - TRUSTED_PROXIES=["frontend"]
      - LOGIN_RATE_LIMIT_ENABLED=${LOGIN_RATE_LIMIT_ENABLED:-true}
      # Telemetry is only accepted for registered satellites; register the
      # simulator's fleet so a fresh stack shows data immediately.
      - SEED_SATELLITES=["CUBESAT1","CUBESAT2","CUBESAT3"]
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=INFO
      # One-time admin password. On a volume, not /tmp: recreating the
      # container (e.g. an image update) before the first login would
      # otherwise lose it for good. Read it with:
      #   docker compose exec backend cat /var/lib/cubesat/admin_bootstrap
      - ADMIN_BOOTSTRAP_FILE=/var/lib/cubesat/admin_bootstrap
    volumes:
      - ./backend:/app
      - *secrets-ro
      - backend-state:/var/lib/cubesat
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Satellite Simulator (acts as a ground station on the bus) ===
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: cubesat-simulator
    depends_on:
      nats:
        condition: service_healthy
    environment:
      - SIM_NATS_URL=nats://nats:4222
      - SIM_NATS_USER=groundstation
      - SIM_NATS_PASSWORD_FILE=/run/secrets/cubesat/nats_groundstation_password
      - SIM_SATELLITES=CUBESAT1,CUBESAT2,CUBESAT3
      - SIM_INTERVAL_S=1.0
      - SIM_FAULT_PROBABILITY=0.001
    volumes:
      - *secrets-ro
    restart: unless-stopped

  # === Frontend (React + Vite, served via nginx; proxies /api and /ws) ===
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Optional public Cesium Ion token from .env; without it the globe
        # uses Cesium's bundled offline imagery.
        VITE_CESIUM_TOKEN: ${VITE_CESIUM_TOKEN:-}
    container_name: cubesat-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # === Prometheus (metrics scraper) ===
  prometheus:
    image: prom/prometheus:latest
    container_name: cubesat-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  # === Grafana (dashboards) ===
  grafana:
    image: grafana/grafana:latest
    container_name: cubesat-grafana
    ports:
      - "3001:3000"
    environment:
      # Password: docker compose run --rm secrets show
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/cubesat/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deployment/grafana/provisioning:/etc/grafana/provisioning
      - *secrets-ro
    depends_on:
      secrets:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped

  # === Loki (log aggregation) ===
  loki:
    image: grafana/loki:2.9.0
    container_name: cubesat-loki
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./deployment/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    restart: unless-stopped

  # === Promtail (log shipper — tails container logs to Loki) ===
  promtail:
    image: grafana/promtail:2.9.0
    container_name: cubesat-promtail
    volumes:
      - ./deployment/loki/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  cubesat-secrets:
  backend-state:
  timescaledb-data:
  redis-data:
  nats-data:
  grafana-data:
  loki-data:

networks:
  default:
    name: cubesat-net
