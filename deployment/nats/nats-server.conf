# NATS server configuration — CubeSat C2
#
# v0.1.0 ran NATS with no authentication on a published port, so anyone on
# the network could inject telemetry, read every satellite's data, forge
# command ACKs, or publish straight onto the uplink queue — bypassing JWT,
# RBAC, the policy engine, two-admin approval and the audit log.
#
# Two identities, least privilege:
#   backend        the C2 core; owns the bus (JetStream API, all subjects)
#   groundstation  radio side (simulator, real ground station software):
#                  may only hand in raw frames and ACKs, and only read the
#                  uplink queue. It cannot publish uplink commands, canonical
#                  telemetry or events, read telemetry, or touch JetStream.
#
# Passwords come from the environment (see deployment/bootstrap/init-secrets.sh).

jetstream {
  store_dir: /data
}

# Monitoring endpoint — reachable inside the compose network only.
http_port: 8222

authorization {
  users = [
    {
      user: backend
      password: $NATS_BACKEND_PASSWORD
      permissions: {
        publish: ">"
        subscribe: ">"
      }
    }
    {
      user: groundstation
      password: $NATS_GROUNDSTATION_PASSWORD
      permissions: {
        publish: {
          allow: ["telemetry.raw.>", "commands.ack.>"]
        }
        subscribe: {
          # commands.<sat> is the uplink queue (one token, so it does not
          # match commands.ack.<sat>). _INBOX_gs.> receives JetStream
          # publish acknowledgements — clients must connect with
          # inbox_prefix="_INBOX_gs" so they can't read other inboxes.
          allow: ["commands.*", "_INBOX_gs.>"]
        }
      }
    }
  ]
}
