---
# NATS server configuration — authentication + per-service permissions.
# Keep in sync with deployment/nats/nats-server.conf (same content).
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: cubesat-c2
  labels:
    app.kubernetes.io/name: cubesat-c2
    app.kubernetes.io/component: nats
data:
  nats-server.conf: |
    # NATS server configuration — CubeSat C2
    #
    # v0.1.0 ran NATS with no authentication on a published port, so anyone on
    # the network could inject telemetry, read every satellite's data, forge
    # command ACKs, or publish straight onto the uplink queue — bypassing JWT,
    # RBAC, the policy engine, two-admin approval and the audit log.
    #
    # Two identities, least privilege:
    #   backend        the C2 core; owns the bus (JetStream API, all subjects)
    #   groundstation  radio side (simulator, real ground station software):
    #                  may only hand in raw frames and ACKs, and only read the
    #                  uplink queue. It cannot publish uplink commands, canonical
    #                  telemetry or events, read telemetry, or touch JetStream.
    #
    # Passwords come from the environment (see deployment/bootstrap/init-secrets.sh).

    jetstream {
      store_dir: /data
    }

    # Monitoring endpoint — reachable inside the compose network only.
    http_port: 8222

    authorization {
      users = [
        {
          user: backend
          password: $NATS_BACKEND_PASSWORD
          permissions: {
            publish: ">"
            subscribe: ">"
          }
        }
        {
          user: groundstation
          password: $NATS_GROUNDSTATION_PASSWORD
          permissions: {
            publish: {
              allow: ["telemetry.raw.>", "commands.ack.>"]
            }
            subscribe: {
              # commands.<sat> is the uplink queue (one token, so it does not
              # match commands.ack.<sat>). _INBOX_gs.> receives JetStream
              # publish acknowledgements — clients must connect with
              # inbox_prefix="_INBOX_gs" so they can't read other inboxes.
              allow: ["commands.*", "_INBOX_gs.>"]
            }
          }
        }
      ]
    }

---
# Deployment for NATS JetStream
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: cubesat-c2
  labels:
    app.kubernetes.io/name: cubesat-c2
    app.kubernetes.io/component: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
        app.kubernetes.io/name: cubesat-c2
        app.kubernetes.io/component: nats
    spec:
      containers:
        - name: nats
          image: nats:alpine
          args: ["-c", "/etc/nats/nats-server.conf"]
          env:
            - name: NATS_BACKEND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cubesat-secrets
                  key: NATS_BACKEND_PASSWORD
            - name: NATS_GROUNDSTATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cubesat-secrets
                  key: NATS_GROUNDSTATION_PASSWORD
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8222
              name: monitor
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: nats-data
              mountPath: /data
            - name: nats-config
              mountPath: /etc/nats
              readOnly: true
      volumes:
        - name: nats-data
          emptyDir: {}
        - name: nats-config
          configMap:
            name: nats-config

---
# Service for NATS
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: cubesat-c2
  labels:
    app.kubernetes.io/name: cubesat-c2
    app.kubernetes.io/component: nats
spec:
  selector:
    app: nats
  ports:
    - port: 4222
      targetPort: 4222
      name: client
    - port: 8222
      targetPort: 8222
      name: monitor
